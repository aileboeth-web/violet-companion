<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Violet 图片系统</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#0b1120; --bg2:#111827; --card:rgba(17,24,39,.82); --border:rgba(148,163,184,.15);
            --text:#e2e8f0; --muted:#64748b; --red:#f87171; --green:#4ade80; --amber:#f59e0b; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:linear-gradient(135deg,var(--bg),var(--bg2));
           color:var(--text); min-height:100vh; }
    .topbar { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border); }
    .topbar h1 { font-size:17px; }
    a.back, button { font-size:13px; color:var(--text); background:transparent; border:1px solid var(--border);
                     border-radius:999px; padding:4px 10px; cursor:pointer; text-decoration:none; }
    main { max-width:1200px; margin:0 auto; padding:16px; display:grid; gap:16px; }
    section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; overflow-x:auto; }
    h2 { font-size:15px; margin-bottom:10px; }
    .muted { color:var(--muted); font-size:12px; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th, td { text-align:left; padding:5px; border-bottom:1px solid var(--border); vertical-align:top; }
    .verified { color:var(--green); } .declared { color:var(--amber); } .unsupported { color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; }
    .grid figure { border:1px solid var(--border); border-radius:10px; padding:6px; font-size:11px; }
    .grid img { width:100%; height:120px; object-fit:contain; background:#000; border-radius:6px; }
    pre { white-space:pre-wrap; font-size:12px; }
  </style>
</head>
<body>
  <div class="topbar"><h1>Violet 图片系统</h1><div><a class="back" href="/">返回</a> <button onclick="load()">刷新</button></div></div>
  <main>
    <section><h2>状态与预算</h2><div id="status"></div></section>
    <section><h2>模型与能力矩阵</h2><p class="muted">verified = 已用真实接口验证；declared = 仅声明，正式业务不会使用。验证会调用真实接口，可能收费。</p>
      <table id="models"></table></section>
    <section><h2>视觉身份</h2><pre id="visual"></pre>
      <p class="muted">修改：在下面输入 JSON 片段（如 {"wardrobe": {...}}），会递增版本并记录历史。</p>
      <textarea id="patch" rows="4" style="width:100%;background:#0b1120;color:#e2e8f0;border:1px solid #334155;border-radius:8px"></textarea>
      <button onclick="savePatch()">保存视觉设定</button></section>
    <section><h2>图片</h2><div id="assets" class="grid"></div></section>
    <section><h2>图片任务</h2><table id="tasks"></table></section>
    <section><h2>用量（按模型和日期）</h2><table id="usage"></table></section>
  </main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// a value passed to an inline handler: a JSON string literal, HTML-escaped for the attribute (phase 9.0.1;
// esc() alone is undone by the attribute parser, so '...' quoting could be broken out of)
const jsarg = v => esc(JSON.stringify(String(v ?? "")));
async function api(path, method = "GET", data) {
  const r = await fetch(path, {method, credentials: "same-origin",
    headers: data ? {"Content-Type": "application/json"} : {}, body: data ? JSON.stringify(data) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.error || r.status); throw new Error(j.error); }
  return j;
}
async function act(path, data, method = "POST") { await api(path, method, data || {}); load(); }
async function verify(entry, cap, free) {
  if (!free && !confirm(`验证 ${entry} 的 ${cap} 会调用真实接口，可能产生费用。继续？`)) return;
  const r = await api(`/api/images/models/${encodeURIComponent(entry)}/verify/${encodeURIComponent(cap)}`, "POST", {confirm_paid: true});
  alert(r.passed ? "验证通过" : "验证未通过：" + (r.task.error_code || "")); load();
}
async function savePatch() {
  let patch; try { patch = JSON.parse(document.getElementById("patch").value); } catch (e) { alert("不是合法 JSON"); return; }
  await act("/api/images/visual-profile", {patch, note: prompt("修改说明") || ""}, "PUT");
}
async function load() {
  const p = await api("/api/images/providers"), t = await api("/api/images/tasks"), a = await api("/api/images/assets");
  const u = await api("/api/images/usage"), v = await api("/api/images/visual-profile");
  document.getElementById("status").innerHTML = `<p>图片功能：${p.enabled ? "开启" : "关闭（VIOLET_IMAGE_ENABLED=0）"} · 今日 ${p.usage_today.images} 张 / 费用估算 ${p.usage_today.cost}
    · 全局上限 ${esc(JSON.stringify(p.budgets.global || {}))}</p><p class="muted">配置文件：${esc(p.config_file)} · 媒体：${u.media.assets} 个，${u.media.bytes} 字节</p>`;
  document.getElementById("models").innerHTML = `<tr><th>模型</th><th>适配器</th><th>启用</th><th>优先级</th><th>密钥变量</th><th>价格</th>` +
    p.capabilities.map(c => `<th>${esc(c)}</th>`).join("") + `<th>今日</th><th>说明</th></tr>` +
    p.models.map(m => `<tr><td>${esc(m.entry_id)}</td><td>${esc(m.adapter_type)}</td>
      <td>${m.enabled ? "是" : "否"} <button onclick="act(${jsarg(`/api/images/models/${encodeURIComponent(m.entry_id)}/${m.enabled ? "disable" : "enable"}`)})">${m.enabled ? "禁用" : "启用"}</button></td>
      <td>${esc(m.priority)} <button onclick="(n => n && act(${jsarg(`/api/images/models/${encodeURIComponent(m.entry_id)}/priority`)}, {priority: +n}))(prompt('新优先级（越小越优先）'))">改</button></td>
      <td>${esc(m.api_key_env)} ${m.api_key_env ? (m.api_key_present ? "（已设置）" : "（未设置）") : ""}</td>
      <td>${m.pricing.free ? "免费" : (m.pricing.confirmed ? "已确认" : "未确认")}</td>` +
      p.capabilities.map(c => { const s = m.capabilities[c] || "unsupported";
        return `<td class="${esc(s)}">${s === "unsupported" ? "—" : esc(s)}${s === "declared" ? ` <button onclick="verify(${jsarg(m.entry_id)},${jsarg(c)},${!!m.pricing.free})">验证</button>` : ""}</td>`; }).join("") +
      `<td>${esc(m.usage_today.calls)} 次 / ${esc(m.usage_today.failures)} 失败</td><td class="muted">${esc(m.status_note)} ${esc((m.config_errors || []).join("; "))}</td></tr>`).join("");
  document.getElementById("visual").textContent = `v${v.profile.version}\n` + JSON.stringify(v.profile, null, 2);
  document.getElementById("assets").innerHTML = a.assets.slice(0, 60).map(x => `<figure>
      ${x.status === "ready" ? `<img loading="lazy" src="/api/images/assets/${encodeURIComponent(x.id)}/file" alt="">` : `<div class="muted">${esc(x.status)}</div>`}
      <figcaption>#${esc(x.id)} ${esc(x.direction)} ${esc(x.media_kind)} ${x.ai_generated ? "AI" : ""} ${esc(x.send_status)}
      ${x.status !== "deleted" ? `<button onclick="confirm(${jsarg(`删除图片 #${x.id}？`)}) && act(${jsarg(`/api/images/assets/${encodeURIComponent(x.id)}`)}, null, 'DELETE')">删除</button>` : ""}</figcaption></figure>`).join("");
  document.getElementById("tasks").innerHTML = "<tr><th>时间</th><th>类型</th><th>来源</th><th>状态</th><th>指定模型</th><th>实际模型</th><th>错误</th><th>输出</th></tr>" +
    t.tasks.map(x => `<tr><td>${esc((x.created_at || "").slice(5, 16))}</td><td>${esc(x.kind)}</td><td>${esc(x.origin)}</td><td>${esc(x.status)}</td>
      <td>${esc(x.requested_model)}</td><td>${esc(x.entry_id)}</td><td>${esc(x.error_code)}</td><td>${esc(x.output_asset_ids)}</td></tr>`).join("");
  document.getElementById("usage").innerHTML = "<tr><th>日期</th><th>模型</th><th>请求</th><th>成功</th><th>失败</th><th>张数</th><th>估算费用</th><th>实际费用</th><th>平均延迟 ms</th></tr>" +
    u.usage.map(x => `<tr><td>${esc(x.day)}</td><td>${esc(x.entry_id)}</td><td>${x.calls}</td><td>${x.ok}</td><td>${x.failed}</td><td>${x.images}</td>
      <td>${esc(x.est_cost)}</td><td>${esc(x.actual_cost)}</td><td>${Math.round(x.avg_latency_ms || 0)}</td></tr>`).join("");
}
load();
</script>
</body>
</html>
