<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Violet 联网与探索</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#0b1120; --bg2:#111827; --card:rgba(17,24,39,.82); --border:rgba(148,163,184,.15);
            --text:#e2e8f0; --muted:#64748b; --accent:#6366f1; --red:#f87171; --green:#4ade80; --amber:#f59e0b; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:linear-gradient(135deg,var(--bg),var(--bg2));
           color:var(--text); min-height:100vh; }
    .topbar { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border); }
    .topbar h1 { font-size:17px; }
    a.back, button, input { font-size:13px; color:var(--text); background:transparent; border:1px solid var(--border);
                     border-radius:999px; padding:5px 12px; cursor:pointer; text-decoration:none; }
    input { border-radius:8px; cursor:text; }
    main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; }
    section { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; overflow-x:auto; }
    h2 { font-size:15px; margin-bottom:10px; }
    .muted { color:var(--muted); font-size:12px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:6px; border-bottom:1px solid var(--border); vertical-align:top; word-break:break-all; }
    .s-ok,.s-active,.s-on { color:var(--green); } .s-budget,.s-disabled { color:var(--amber); } .s-error,.s-blocked,.s-off { color:var(--red); }
    a { color:#93c5fd; }
  </style>
</head>
<body>
  <div class="topbar"><h1>Violet 联网与探索</h1><div><a class="back" href="/">返回</a> <button onclick="load()">刷新</button></div></div>
  <main>
    <section><h2>状态与预算</h2><div id="status"></div></section>
    <section><h2>自主探索</h2><p id="explorer" class="muted"></p>
      <button onclick="act('/api/web/explorer/enable')">开启</button> <button onclick="act('/api/web/explorer/disable')">关闭</button>
      <p class="muted">需要部署时设置 VIOLET_WEB_EXPLORER=1 才能开启；探索结果只保存，不会自动发送。</p></section>
    <section><h2>外部发现（web_findings）</h2><table id="findings"></table></section>
    <section><h2>来源（域名）</h2><input id="domain" placeholder="example.org"> <button onclick="setSource('disabled')">禁用</button>
      <button onclick="setSource('enabled')">启用</button><table id="sources"></table></section>
    <section><h2>阅读记录（Violet 的虚拟阅读行为）</h2><table id="reading"></table></section>
    <section><h2>搜索与读取记录</h2><table id="requests"></table></section>
  </main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tag = s => `<span class="s-${esc(s)}">${esc(s)}</span>`;
const link = u => /^https?:\/\//i.test(u || "") ? `<a href="${esc(u)}" rel="noopener noreferrer nofollow" target="_blank">${esc(u)}</a>` : esc(u);
async function api(path, method = "GET", data) {
  const r = await fetch(path, {method, credentials: "same-origin",
    headers: data ? {"Content-Type": "application/json"} : {}, body: data ? JSON.stringify(data) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.error || r.status); throw new Error(j.error); }
  return j;
}
async function act(path, data) { await api(path, "POST", data || {}); load(); }
async function setSource(status) {
  const domain = document.getElementById("domain").value.trim(); if (!domain) return;
  const reason = status === "disabled" ? (prompt("原因（可选）") || "") : "";
  await act("/api/web/sources", {domain, status, reason});
}
async function load() {
  const s = await api("/api/web/status"), f = await api("/api/web/findings"), src = await api("/api/web/sources");
  const rr = await api("/api/web/reading-records"), rq = await api("/api/web/requests?limit=100");
  document.getElementById("status").innerHTML = `<p>联网工具：${s.web_enabled ? "开启" : "关闭"} · 搜索后端：${esc(s.search_provider)}</p>
    <p>今日搜索 ${s.used_today.search}/${s.limits.max_searches_per_day} · 今日读取 ${s.used_today.fetch}/${s.limits.max_fetches_per_day}
    · 探索搜索 ${s.used_today.explorer_search} · 探索费用估算 ${s.explorer.cost_today.toFixed(3)}</p>
    <p class="muted">今日失败/拦截：${s.recent_failures.length} 条</p>`;
  document.getElementById("explorer").innerHTML = `模式：${tag(s.explorer.mode)}（已授权：${s.explorer.authorized ? "是" : "否"}）`;
  document.getElementById("findings").innerHTML = "<tr><th>标题</th><th>来源</th><th>发布</th><th>可信度</th><th>来自</th><th>聊天用过</th><th>已分享</th><th>状态</th><th></th></tr>" +
    f.findings.map(x => `<tr><td>${esc(x.title)}<br>${link(x.url)}</td><td>${esc(x.domain)}</td>
      <td>${esc((x.published_at || "").slice(0, 10))}${x.published_verified ? "" : (x.published_at ? "（未核实）" : "未知")}</td>
      <td>${esc(x.trust)}</td><td>${esc(x.origin)}</td><td>${esc(x.used_count)}</td><td>${esc(x.share_count)}</td><td>${tag(x.status)}</td>
      <td>${x.status === "active" ? `<button onclick="act('/api/web/findings/${+x.id}/disable')">禁用</button>` : `<button onclick="act('/api/web/findings/${+x.id}/enable')">启用</button>`}</td></tr>`).join("");
  document.getElementById("sources").innerHTML = "<tr><th>域名</th><th>状态</th><th>原因</th></tr>" +
    src.sources.map(x => `<tr><td>${esc(x.domain)}</td><td>${tag(x.status)}</td><td>${esc(x.reason)}</td></tr>`).join("");
  document.getElementById("reading").innerHTML = "<tr><th>时间</th><th>内容</th><th>来源链接</th><th>状态</th></tr>" +
    rr.reading_records.map(x => `<tr><td>${esc((x.occurred_at || "").slice(0, 16))}</td><td>${esc(x.content)}</td><td>${link(x.source_url)}</td><td>${tag(x.status)}</td></tr>`).join("");
  document.getElementById("requests").innerHTML = "<tr><th>时间</th><th>类型</th><th>来自</th><th>内容</th><th>状态</th><th>原因</th><th>结果</th></tr>" +
    rq.requests.map(x => `<tr><td>${esc((x.created_at || "").slice(5, 16))}</td><td>${esc(x.kind)}</td><td>${esc(x.origin)}</td><td>${esc(x.target)}</td>
      <td>${tag(x.status)}</td><td>${esc(x.error_code)}</td><td>${x.result_count}</td></tr>`).join("");
}
load();
</script>
</body>
</html>
