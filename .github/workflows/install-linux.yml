# Linux acceptance of the one-command install (phase 10.7). On GitHub's Ubuntu VMs systemd is real, so this covers
# what a container cannot: the systemd unit, enable-at-boot, restart after kill -9, unit removal on uninstall.
# On failure the last lines of the output are also written as an error annotation, on success the PASS lines as a
# notice (both readable without signing in, through the check-run annotations API).
name: install-linux
# 0.7.5 (user: small changes should not wait ~20 minutes for this): only when the installer or what it sets up on
# the system changes, only on main (a release tag does not run it again); by hand with workflow_dispatch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["violet/install.sh", "violet/tools/violet_installer.py", "violet/tools/violet_setup.py",
            "violet/tools/violet_service.py", "violet/tools/violet_relay.py", "violet/tools/violet_searxng.py",
            "violet/requirements.txt", "violet/deploy/linux-e2e/**", ".github/workflows/install-linux.yml"]
jobs:
  systemd:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: a normal user with sudo runs the same one-line command (through a pipe)
        run: |
          set -o pipefail
          python3 violet/tools/make_release.py --base http://127.0.0.1:18766 --out /tmp/rel --worktree >/dev/null
          (cd /tmp/rel && nohup python3 -m http.server 18766 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          [ "$(id -u)" != "0" ]
          curl -fsSL http://127.0.0.1:18766/install.sh | bash -s -- doctor --json 2>&1 | tee doctor.log
          grep -q "用 sudo 重新运行" doctor.log
          grep -q '"root": "/opt/violet"' doctor.log
          echo "PASS normal user with sudo: install.sh ran itself again as root"
      - name: a restrictive host firewall (INPUT policy DROP, as with 1Panel / CSF)
        run: |
          sudo iptables -I INPUT 1 -i lo -s 127.0.0.0/8 -j ACCEPT
          sudo iptables -I INPUT 2 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -P INPUT DROP
      - name: one-command install, repair, backup, failed upgrade, uninstall (systemd)
        run: |
          set -o pipefail
          sudo VIOLET_E2E_STRICT_FIREWALL=1 bash "violet/deploy/linux-e2e/install_e2e.sh" 2>&1 | tee e2e.log
      - name: report the failure
        if: failure()
        run: |
          tail -n 60 e2e.log | python3 -c "import sys; t=sys.stdin.read(); print('::error title=install_e2e (${{ matrix.os }})::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
      - name: report what passed
        if: success()
        run: |
          grep -E '^(PASS|ALL PASSED)' e2e.log | python3 -c "import sys; t=sys.stdin.read(); print('::notice title=install_e2e (${{ matrix.os }})::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: debian / ubuntu / rocky containers (supervisor mode)
        run: |
          set -o pipefail
          bash "violet/deploy/linux-e2e/run_in_docker.sh" debian:12 ubuntu:24.04 rockylinux:9 2>&1 | tee e2e.log
      - name: report the failure
        if: failure()
        run: |
          tail -n 60 e2e.log | python3 -c "import sys; t=sys.stdin.read(); print('::error title=install_e2e (containers)::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
